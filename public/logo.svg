<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CaptionFab Logo">
  <title>CaptionFab</title>
  <desc>Professional video subtitle extraction tool logo</desc>
  
  <defs>
    <!-- Primary gradient: deep blue to cyan -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    
    <!-- Accent gradient: warm amber -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Clip path for rounded square -->
    <clipPath id="iconClip">
      <rect x="20" y="20" width="216" height="216" rx="48"/>
    </clipPath>
  </defs>
  
  <!-- Background: rounded square with gradient -->
  <rect x="0" y="0" width="256" height="256" rx="64" fill="url(#brandGradient)"/>
  
  <!-- Subtle inner highlight -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#innerShadow)"/>
  
  <!-- Film frame / video icon -->
  <g transform="translate(64, 56)">
    <!-- Outer frame (film strip style) -->
    <rect x="0" y="0" width="128" height="96" rx="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
    
    <!-- Film perforations (left side) -->
    <rect x="-8" y="8" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="-8" y="30" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="-8" y="52" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="-8" y="74" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    
    <!-- Film perforations (right side) -->
    <rect x="130" y="8" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="130" y="30" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="130" y="52" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="130" y="74" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    
    <!-- Play button triangle (center) -->
    <polygon points="52,28 96,50 52,72" fill="#ffffff" opacity="0.95"/>
    
    <!-- Caption/text overlay indicator (bottom of frame) -->
    <rect x="16" y="72" width="96" height="16" rx="4" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="24" y="76" width="60" height="8" rx="2" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="24" y="86" width="40" height="6" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  </g>
  
  <!-- Sparkle / "Fab" accent (top-right corner) -->
  <g transform="translate(180, 32)" filter="url(#softGlow)">
    <polygon points="0,-12 4,0 0,12 -4,0" fill="url(#accentGradient)" opacity="0.9"/>
    <polygon points="8,-4 10,0 8,4 6,0" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Subtle corner accent (bottom-left) -->
  <path d="M 32 224 L 56 224 L 44 240 Z" fill="#ffffff" fill-opacity="0.15"/>
</svg>
