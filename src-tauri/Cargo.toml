[package]
name = "caption-fab"
version = "3.6.0"
description = "CaptionFab - 专业硬编码字幕提取工具"
authors = ["Agions"]
license = "MIT"
repository = "https://github.com/Agions/CaptionFab"
edition = "2021"

[lib]
name = "caption_fab"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"  # For path validation in file commands

# Rust-native image processing (replaces OpenCV in auto_detect_roi.py)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
# Low-level image bindings for Canny edge detection
rgb = "0.8"
# Pin time to avoid conflict with tauri-utils 2.9.2 (missing HourBase trait in 0.3.47+)
time = ">=0.3.36, <0.3.47"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2.0"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = true
